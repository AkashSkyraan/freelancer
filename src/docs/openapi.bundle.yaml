openapi: 3.0.3
info:
  title: Freelancer API
  version: 1.0.0
  description: Backend API Documentation
servers:
  - url: http://localhost:5000
paths:
  /api/auth/requestotp:
    post:
      tags:
        - Authentication
      summary: Request OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
components:
  schemas:
    LoginRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
          example: '9876543210'
    SuccessResponse:
      type: object
      properties:
        success:
          type: integer
          example: 1
        message:
          type: string
          example: OTP Sent Successfully
        data:
          type: array
